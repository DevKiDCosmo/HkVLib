name: Build Firmware

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Cache PlatformIO
      uses: actions/cache@v4
      with:
        path: |
          ~/.platformio
          .pio
        key: ${{ runner.os }}-pio-${{ hashFiles('**/platformio.ini') }}
        restore-keys: |
          ${{ runner.os }}-pio-
    
    - name: Install PlatformIO
      run: |
        pip install -U platformio
        pio --version
    
    - name: Build firmware
      run: |
        pio run -e mbot2_hybrid
    
    - name: Prepare artifacts
      run: |
        mkdir -p artifacts
        cp .pio/build/mbot2_hybrid/firmware.bin artifacts/firmware.bin
        cp .pio/build/mbot2_hybrid/firmware.elf artifacts/firmware.elf
        # Copy bootloader and partition table if they exist
        if [ -f .pio/build/mbot2_hybrid/bootloader.bin ]; then
          cp .pio/build/mbot2_hybrid/bootloader.bin artifacts/
        fi
        if [ -f .pio/build/mbot2_hybrid/partitions.bin ]; then
          cp .pio/build/mbot2_hybrid/partitions.bin artifacts/
        fi
        # Create a build info file
        echo "Build Date: $(date)" > artifacts/build-info.txt
        echo "Commit: ${{ github.sha }}" >> artifacts/build-info.txt
        echo "Branch: ${{ github.ref_name }}" >> artifacts/build-info.txt
        ls -lh artifacts/
    
    - name: Upload firmware artifacts
      uses: actions/upload-artifact@v4
      with:
        name: firmware-${{ github.sha }}
        path: artifacts/
        retention-days: 30
    
    - name: Create release on tag
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          artifacts/firmware.bin
          artifacts/firmware.elf
          artifacts/build-info.txt
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
